aid: doaj

name: DOAJ

description: The Directory of Open Access Journals (DOAJ) provides a searchable database of peer‑reviewed open access journals and articles, offering
  free access to scholarly content, metadata, and APIs for developers. It supports publishers, libraries, funders, and researchers by promoting
  transparency, best practices, and open science. DOAJ also offers premium services, tools for journal evaluation, and a commitment to preserving
  open scholarly communication.

