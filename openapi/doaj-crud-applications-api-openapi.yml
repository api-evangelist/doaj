                            type: string
                          name:
                            type: string
                        title: bibjson.institution
                        type: object
                      is_replaced_by:
                        items:
                          type: string
                        type: array
                      keywords:
                        items:
                          type: string
                        type: array
                      labels:
                        items:
                          type: string
                        type: array
                      language:
                        items:
                          type: string
                        type: array
                      license:
