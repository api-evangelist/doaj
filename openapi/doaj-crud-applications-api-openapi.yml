                            type: string
                        title: bibjson.other_charges
                        type: object
                      pid_scheme:
                        properties:
                          has_pid_scheme:
                            type: boolean
                          scheme:
                            items:
                              type: string
                            type: array
                        title: bibjson.pid_scheme
                        type: object
                      pissn:
                        type: string
                      plagiarism:
                        properties:
                          detection:
                            type: boolean
                          url:
                            format: url
                            type: string
                        required:
                        - detection
                        - url
                        title: bibjson.plagiarism
                        type: object
                      preservation:
                        properties:
                          has_preservation:
                            type: boolean
                          national_library:
                            items:
                              type: string
                            type: array
                          service:
                            items:
                              type: string
                            type: array
                          url:
                            format: url
                            type: string
                        title: bibjson.preservation
                        type: object
                      publication_time_weeks:
                        type: integer
                      publisher:
                        properties:
                          country:
                            format: country_code
                            type: string
                          name:
                            type: string
                        required:
                        - name
                        title: bibjson.publisher
                        type: object
                      ref:
                        properties:
                          aims_scope:
                            format: url
                            type: string
                          author_instructions:
                            format: url
                            type: string
                          journal:
                            format: url
                            type: string
                          license_terms:
                            format: url
                            type: string
                          oa_statement:
                            format: url
                            type: string
                        required:
                        - journal
                        title: bibjson.ref
                        type: object
                      replaces:
                        items:
                          type: string
                        type: array
                      subject:
                        items:
                          properties:
                            code:
                              type: string
                            scheme:
                              type: string
                            term:
                              type: string
                          title: bibjson.subject
                          type: object
                        type: array
                      title:
                        type: string
                      waiver:
                        properties:
                          has_waiver:
                            type: boolean
                          url:
                            format: url
                            type: string
                        title: bibjson.waiver
                        type: object
                    required:
                    - copyright
                    - deposit_policy
                    - editorial
                    - eissn
                    - keywords
                    - language
                    - license
                    - ref
                    - pid_scheme
                    - pissn
                    - plagiarism
                    - preservation
                    - publication_time_weeks
                    - publisher
                    - oa_start
                    - other_charges
                    - waiver
                    - title
                    title: bibjson
                    type: object
                  created_date:
                    format: date-time
                    type: string
                  id:
                    type: string
                  last_manual_update:
                    format: date-time
                    type: string
                  last_updated:
                    format: date-time
                    type: string
                required:
                - admin
                - bibjson
                title: Application schema
