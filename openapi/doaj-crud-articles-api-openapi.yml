openapi: 3.2.0
info:
  title: Doaj CRUD Articles API
  version: 4.0.0
tags:
- name: CRUD Articles
paths:
  /api/articles:
    post:
      parameters:
      - description: <div class="search-query-docs">Go to 'DASHBOARD' and 'Settings' to find your API key. If there is no key, click 'Generate a new API key'. If you do not see that button, contact us.
        in: query
        name: api_key
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Resource created successfully, response contains the new resource ID and location.
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                  location:
                    type: string
                  status:
                    type: string
        '400':
          description: Bad Request. Your request body was missing a required field, or the data in one of the fields did not match the schema above (e.g. string of latin letters in an integer field). In the Bulk API it may mean that one of the records in the bulk operation failed. See the "error" part of the response for details.
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                  status:
                    type: string
        '401':
          description: Access to this route/resource requires authentication, but you did not provide any credentials.
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                  status:
                    type: string
        '403':
          description: Access to this route/resource requires authentication, and you provided the wrong credentials. This includes situations where you are authenticated successfully via your API key, but you are not the owner of a specific resource and are therefore barred from updating/deleting it.
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                  status:
                    type: string
      summary: Create an article [Authenticated, not public]
      tags:
      - CRUD Articles
      requestBody:
        content:
          application/json:
            schema:
              type: string
        description: "<div class=\"search-query-docs\">\n            Article JSON that you would like to create or update. The contents should comply with the schema displayed\n            in the <a href=\"/api/docs#CRUD_Articles_get_api_articles_article_id\"> GET (Retrieve) an article route</a>.\n            <a href=\"https://doaj.github.io/doaj-docs/master/data_models/IncomingAPIArticle\">Explicit documentation for the structure of this data is available</a>.\n            Partial updates are not allowed; you have to supply the full JSON.</div>"
        required: true
      operationId: postApiArticles
      x-operation-id-source: derived
  /api/articles/{article_id}:
