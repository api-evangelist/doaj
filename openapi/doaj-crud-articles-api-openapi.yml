          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                  status:
                    type: string
      summary: Delete an article [Authenticated, not public]
      tags:
      - CRUD Articles
      operationId: deleteApiArticlesByArticleId
      x-operation-id-source: derived
    get:
      parameters:
      - description: <div class="search-query-docs"><em>Note this parameter is optional for this route - you could, but don't have to supply a key. Doing so grants you access to records of yours that are not public, in addition to all public records.</em> Go to 'MY ACCOUNT' and 'Settings' to find your API key. If there is no key, click 'Generate a new API key'. If you do not see that button, contact us.
        in: query
        name: api_key
        required: false
        schema:
          type: string
      - description: <div class="search-query-docs">DOAJ article ID. E.g. 4cf8b72139a749c88d043129f00e1b07 .</div>
        in: path
        name: article_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A successful request/response
          content:
            application/json:
              schema:
                properties:
                  admin:
                    properties:
                      in_doaj:
                        type: boolean
                      publisher_record_id:
                        type: string
                      upload_id:
                        type: string
                    title: admin
                    type: object
                  bibjson:
                    properties:
                      abstract:
                        type: string
                      author:
                        items:
                          properties:
                            affiliation:
                              type: string
                            name:
                              type: string
                            orcid_id:
                              type: string
                          required:
                          - name
                          title: bibjson.author
                          type: object
                        type: array
                      identifier:
                        items:
                          properties:
                            id:
                              type: string
                            type:
                              type: string
                          required:
                          - type
                          - id
                          title: bibjson.identifier
                          type: object
                        type: array
                      journal:
                        properties:
                          country:
                            type: string
                          end_page:
                            type: string
                          language:
                            items:
                              type: string
                            type: array
                          number:
                            type: string
                          publisher:
                            type: string
                          start_page:
                            type: string
                          title:
                            type: string
                          volume:
                            type: string
                        title: bibjson.journal
                        type: object
                      keywords:
                        items:
                          type: string
                        type: array
                      link:
                        items:
                          properties:
                            content_type:
                              format: link_content_type
                              type: string
                            type:
                              format: link_type
                              type: string
                            url:
                              format: url
                              type: string
                          required:
                          - type
                          - url
                          title: bibjson.link
                          type: object
                        type: array
                      month:
                        type: string
                      subject:
                        items:
                          properties:
                            code:
                              type: string
                            scheme:
                              type: string
                            term:
                              type: string
                          title: bibjson.subject
                          type: object
                        type: array
                      title:
                        type: string
                      year:
                        type: string
                    required:
                    - title
                    - identifier
                    title: bibjson
                    type: object
                  created_date:
                    format: date-time
                    type: string
                  es_type:
                    type: string
                  id:
                    type: string
                  last_updated:
                    format: date-time
                    type: string
                required:
                - bibjson
                title: Article schema
        '401':
          description: Access to this route/resource requires authentication, but you did not provide any credentials.
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                  status:
                    type: string
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                  status:
                    type: string
        '500':
          description: Unable to retrieve the recource. This record contains bad data
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                  status:
                    type: string
      summary: Retrieve an article
      tags:
      - CRUD Articles
      operationId: getApiArticlesByArticleId
      x-operation-id-source: derived
