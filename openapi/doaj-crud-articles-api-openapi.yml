        name: api_key
        required: true
        schema:
          type: string
      - description: <div class="search-query-docs">DOAJ article ID. E.g. 4cf8b72139a749c88d043129f00e1b07 .</div>
        in: path
        name: article_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: OK (Request succeeded), No Content
        '401':
          description: Access to this route/resource requires authentication, but you did not provide any credentials.
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                  status:
                    type: string
        '403':
          description: Access to this route/resource requires authentication, and you provided the wrong credentials. This includes situations where you are authenticated successfully via your API key, but you are not the owner of a specific resource and are therefore barred from updating/deleting it.
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                  status:
                    type: string
        '404':
