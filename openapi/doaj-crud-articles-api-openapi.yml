              schema:
                properties:
                  error:
                    type: string
                  status:
                    type: string
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                  status:
                    type: string
      summary: Update an article [Authenticated, not public]
      tags:
      - CRUD Articles
      requestBody:
        content:
          application/json:
            schema:
              type: string
        description: "<div class=\"search-query-docs\">\n            Article JSON that you would like to create or update. The contents should comply with the schema displayed\n            in the <a href=\"/api/docs#CRUD_Articles_get_api_articles_article_id\"> GET (Retrieve) an article route</a>.\n            <a href=\"https://doaj.github.io/doaj-docs/master/data_models/IncomingAPIArticle\">Explicit documentation for the structure of this data is available</a>.\n            Partial updates are not allowed; you have to supply the full JSON.</div>"
        required: true
